<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found - StrKit</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { colors: { primary: '#6366f1' } } }
    }
  </script>
  <style>
    .gradient-text {
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #a855f7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex items-center justify-center">
  <div class="text-center px-4">
    <h1 class="text-8xl font-bold gradient-text mb-4">404</h1>
    <h2 class="text-2xl font-semibold mb-4">Page Not Found</h2>
    <p class="text-gray-400 mb-8">The page you're looking for doesn't exist or has been moved.</p>
    <div class="flex justify-center gap-4">
      <a href="/" class="px-6 py-3 bg-primary hover:bg-primary/90 text-white font-medium rounded-lg transition">
        Go Home
      </a>
      <a href="/docs/" class="px-6 py-3 bg-gray-800 hover:bg-gray-700 text-white font-medium rounded-lg transition">
        Documentation
      </a>
    </div>
  </div>
</body>
</html>
